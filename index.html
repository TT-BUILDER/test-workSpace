<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Image Pixel Data</title>
</head>
<body>

    <!-- 結果を出力するpタグ -->
    <p id="output">画像を読み込み中...</p>

    <script>
                
        // --------------------------------------------------
        // 設定：何倍縮小するか (例: 1 = 原寸, 2 = 1/2に縮小, 5 = 1/5に縮小)
        // --------------------------------------------------
        const pixMult = 2; 

        // 出力先のpタグを取得
        const outputParagraph = document.getElementById('output');

        // 1. 画像オブジェクトを作成
        const img = new Image();
        img.crossOrigin = 'anonymous'; 

        // 画像の読み込み完了時の処理
        img.onload = function() {
            // 2. メモリ上に非表示のキャンバスを作成
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // 縮小後のサイズを計算（小数点以下は切り捨て）
            const targetWidth = Math.floor(img.width / pixMult);
            const targetHeight = Math.floor(img.height / pixMult);

            // 万が一、縮小値が大きすぎて0pxにならないよう安全策
            canvas.width = targetWidth > 0 ? targetWidth : 1;
            canvas.height = targetHeight > 0 ? targetHeight : 1;

            // 3. キャンバスに縮小して画像を描画
            // 元画像をキャンバスのサイズいっぱいに引き伸ばす（縮小する）ことでリサイズします
            ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, canvas.width, canvas.height);

            try {
                // 4. 縮小されたキャンバスからピクセルデータを取得
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data; 

                const pixelStrings = [];

                // 5. ピクセルデータをループ処理 (4バイトごとに R, G, B, A)
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    pixelStrings.push(`{${r},${g},${b}}`);
                }

                // 6. 指定のフォーマットに組み立て (縮小後のサイズをヘッダーに表示)
                const header = `${canvas.width}px * ${canvas.height}px : `;
                const dataBody = `{${pixelStrings.join(',')}}`;

                // pタグに書き込み
                outputParagraph.textContent = header + dataBody;

            } catch (error) {
                console.error(error);
                outputParagraph.textContent = 'エラーが発生しました。ローカルサーバー経由で起動しているか確認してください。';
            }
        };

        // 画像の読み込み失敗時の処理
        img.onerror = function() {
            outputParagraph.textContent = '画像の読み込みに失敗しました。「./img.jpeg」のパスが正しいか確認してください。';
        };

        // 7. 画像の読み込みを開始
        img.src = './Tamakko.jpeg';

    </script>
</body>
</html>
