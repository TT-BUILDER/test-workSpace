<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Image Pixel Data</title>
</head>
<body>

    <!-- 結果を出力するpタグ -->
    <p id="output">画像を読み込み中...</p>

    <script>
        // --------------------------------------------------
        // 設定
        // --------------------------------------------------
        const pixMult = 2;   // 何倍縮小するか (1 = 原寸)
        const newLineN = 10; // 何ピクセルごとに改行するか

        // 出力先のpタグを取得
        const outputParagraph = document.getElementById('output');
        // pタグ内で改行コード (\n) を有効にするためのCSS設定
        outputParagraph.style.whiteSpace = 'pre-wrap';

        // 1. 画像オブジェクトを作成
        const img = new Image();
        img.crossOrigin = 'anonymous'; 

        // 画像の読み込み完了時の処理
        img.onload = function() {
            // 2. メモリ上に非表示のキャンバスを作成
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // 縮小後のサイズを計算
            const targetWidth = Math.floor(img.width / pixMult);
            const targetHeight = Math.floor(img.height / pixMult);

            canvas.width = targetWidth > 0 ? targetWidth : 1;
            canvas.height = targetHeight > 0 ? targetHeight : 1;

            // 3. キャンバスに縮小して画像を描画
            ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, canvas.width, canvas.height);

            try {
                // 4. ピクセルデータを取得
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data; 

                const pixelStrings = [];
                let pixelCount = 0;

                // 5. ピクセルデータをループ処理
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    let pixelStr = `{${r},${g},${b}}`;
                    
                    pixelCount++;

                    // 最後のピクセルではなく、かつ設定された個数に達したら後ろに改行を追加
                    if (pixelCount % newLineN === 0 && i + 4 < data.length) {
                        pixelStr += ',\n';
                    } else if (i + 4 < data.length) {
                        // 途中のデータにはカンマを付与
                        pixelStr += ',';
                    }

                    pixelStrings.push(pixelStr);
                }

                // 6. 指定のフォーマットに組み立て
                const header = `${canvas.width}px * ${canvas.height}px : \n`; // ヘッダーの後にも改行を挿入
                const dataBody = `{${pixelStrings.join('')}}`;

                // pタグに書き込み
                outputParagraph.textContent = header + dataBody;

            } catch (error) {
                console.error(error);
                outputParagraph.textContent = 'エラーが発生しました。ローカルサーバー経由で起動しているか確認してください。';
            }
        };

        // 画像の読み込み失敗時の処理
        img.onerror = function() {
            outputParagraph.textContent = '画像の読み込みに失敗しました。「./img.jpeg」のパスが正しいか確認してください。';
        };

        // 7. 画像の読み込みを開始
        img.src = './Tamakko.jpeg';

    </script>
</body>
</html>
